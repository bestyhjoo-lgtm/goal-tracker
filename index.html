<style>

  .field{margin-bottom:14px;}

  input, textarea, select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--navy);color:var(--ink);box-shadow:none;}

  .cheer-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;height:80px;overflow:hidden;}
  .cheer-item p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .cheer-item p{margin:0;font-size:13.5px;line-height:1.5;white-space:pre-wrap;font-family:'Manrope','Noto Sans KR',sans-serif;}
  .cheer-item .ts{font-size:11px;color:var(--ink-soft);margin-top:4px;font-family:'Manrope','Noto Sans KR',sans-serif;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}

  .modal-box .modal-head h2{margin:0;font-size:20px;color:var(--ink);border-bottom:none;padding-bottom:0;}
  .close-x{background:none;border:none;font-size:20px;color:var(--ink-soft);padding:4px 8px;font-family:'Manrope','Noto Sans KR',sans-serif;}
  .close-x:hover{color:var(--ink);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:700px){.grid2{grid-template-columns:1fr;}}

  .student-chip{display:inline-flex;align-items:center;gap:6px;background:var(--navy);border:1px solid var(--border);padding:9px 14px;border-radius:20px;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;margin:4px;font-family:'Manrope','Noto Sans KR',sans-serif;}
  .student-chip:hover{border-color:var(--accent);background:rgba(140,124,246,.12);color:var(--accent);}
  .group-block{margin-bottom:20px;}
  .group-block h4{margin:0 0 8px;font-size:13px;color:var(--accent);font-family:'Manrope','Noto Sans KR',sans-serif;font-weight:700;}

  .qa-entry{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--navy);}
  .qa-entry .qdate{font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:8px;font-family:'Manrope','Noto Sans KR',sans-serif;}
  .qa-entry img{max-width:100%;border-radius:8px;margin-bottom:8px;display:block;}
  .answer-box{background:var(--green-bg);border:1px solid var(--green);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.5px;font-family:'Manrope','Noto Sans KR',sans-serif;color:var(--ink);}
  .answer-box .label{display:inline-block;background:var(--green);color:#0D0D14;font-weight:700;font-size:11px;letter-spacing:.3px;padding:2px 9px;border-radius:20px;margin-bottom:8px;}
  .answer-box .content{display:block;line-height:1.55;}
  .no-answer{color:var(--ink-soft);font-size:12.5px;font-style:italic;margin-top:6px;font-family:'Manrope','Noto Sans KR',sans-serif;}

  .yc{display:inline-block;width:16px;height:22px;background:var(--orange);border-radius:3px;vertical-align:middle;margin-right:6px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .small-muted{color:var(--ink-soft);font-size:12.5px;font-family:'Manrope','Noto Sans KR',sans-serif;}
  .thumb-preview{max-width:160px;border-radius:8px;margin-top:8px;display:none;border:1px solid var(--border);}
  .divider{border:none;height:1px;background:var(--border);margin:16px 0;}
  .stat-box{text-align:center;padding:10px;background:var(--navy);border:1px solid var(--border);border-radius:12px;flex:1;}
  .stat-box .num{font-size:22px;font-weight:800;color:var(--ink);}
  .stat-box .lab{font-size:11px;color:var(--ink-soft);margin-top:2px;font-family:'Manrope','Noto Sans KR',sans-serif;}

  .thread{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .thread-msg{border-radius:10px;padding:9px 12px;font-size:13.5px;max-width:92%;}
  .thread-msg.from-teacher{background:var(--green-bg);border:1px solid var(--green);align-self:flex-start;}
  .thread-msg.from-student{background:rgba(140,124,246,.14);border:1px solid var(--accent);align-self:flex-end;}
  .thread-who{font-size:11px;font-weight:700;margin-bottom:3px;color:var(--ink-soft);}
  .thread-text{line-height:1.5;white-space:pre-wrap;color:var(--ink);}
  .comment-input-row{display:flex;gap:6px;margin-top:8px;}
  .comment-input-row input{flex:1;}

  .cal-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px;}
  .cal-title{font-weight:800;font-size:15px;color:var(--ink);min-width:100px;text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700;padding-bottom:4px;}
  .cal-cell{background:var(--navy);border:1px solid var(--border);border-radius:8px;min-height:80px;padding:4px;position:relative;text-align:center;}
  .cal-cell.empty{background:transparent;border:none;}

</style>

<body>
<div id="app"><div class="wrap"><p class="empty">불러오는 중...</p></div></div>

<script>
/* ============ 저장소 백엔드 설정 (Google Apps Script) ============
   아래 APPS_SCRIPT_URL에 배포한 Google Apps Script 웹앱 URL을 붙여넣으세요.
   (설정 방법은 별도로 안내한 가이드를 참고하세요)
*/
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxiGsHbPyCZiqy6L_24Z-NOhpjt_q5MO2YOKd5Rgw8LhrfagamJxVores8kScqihq3Pog/exec';

async function callBackend(payload){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'}, // CORS 프리플라이트 회피를 위해 text/plain 사용
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('서버 연결에 실패했습니다.');
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}
window.storage = {
  get: async (key, shared) => {
    const r = await callBackend({action:'get', key});
    if(!r.found) return null;
    return {key, value:r.value, shared};
  },
  set: async (key, value, shared) => {
    await callBackend({action:'set', key, value});
    return {key, value, shared};
  },
  delete: async (key, shared) => {
    await callBackend({action:'delete', key});
    return {key, deleted:true, shared};
  },
  list: async (prefix, shared) => {
    const r = await callBackend({action:'list', prefix});
    return {keys: r.keys || [], prefix, shared};
  }
};

/* ============ 상태 ============ */
let CORE = {groups:[], students:[], goals:{}, messages:{}, cards:{}, notice:'', cheers:[]};
let session = {role:null, studentId:null};
let view = {page:'home', tab:'groups', data:{}};
let modal = null;
let tempPhotos = [];
let tempMsgPhotos = [];
let cheerRotateIndex = 0;
let saving = false;

function toast(msg){
  let el = document.getElementById('toastBox');
  if(!el){
    el = document.createElement('div');
    el.id='toastBox';
    el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:13.5px;z-index:300;box-shadow:0 8px 24px rgba(140,124,246,.35);opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity='1';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ el.style.opacity='0'; }, 2200);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  const parts = d.split('-');
  return parts[1]+'/'+parts[2];
}
function dayOfWeekKr(dateStr){
  const days = ['일','월','화','수','목','금','토'];
  const d = new Date(dateStr+'T00:00:00');
  return isNaN(d.getTime()) ? '' : days[d.getDay()];
}

/* ============ 저장/불러오기 ============ */
function applyCoreDefaults(obj){
  if(!obj.groups) obj.groups=[];
  if(!obj.students) obj.students=[];
  if(!obj.goals) obj.goals={};
  if(!obj.problems) obj.problems={};
  if(!obj.messages) obj.messages={};
  if(!obj.cards) obj.cards={};
  if(!obj.cheers) obj.cheers=[];
  if(!obj.notice) obj.notice='';
  if(!obj.stampImage) obj.stampImage='';
  if(!obj.ntfyTopic) obj.ntfyTopic='jnsci-goaltracker-5dmfwjfju8';
  if(!obj.qFolders) obj.qFolders=[];
  if(!obj.qBoard) obj.qBoard={};
  if(!obj.goalText) obj.goalText={};
  if(!obj.resultTasks) obj.resultTasks=[];
  Object.keys(obj.goals).forEach(sid=>{
    if(obj.goalText[sid]===undefined){
      const dates = Object.keys(obj.goals[sid]||{}).sort().reverse();
      let latestText = '';
      for(const d of dates){ if(obj.goals[sid][d] && obj.goals[sid][d].text){ latestText = obj.goals[sid][d].text; break; } }
      obj.goalText[sid] = latestText;
    }
  });
  return obj;
}
async function loadCore(){
  let connectionError = null;
  try{
    const r = await window.storage.get('core', true);
    if(r && r.value) CORE = JSON.parse(r.value);
    lastSyncTime = Date.now();
  }catch(e){ connectionError = e; }
  applyCoreDefaults(CORE);
  if(!connectionError){
    const msgsChanged = normalizeMessages();
    if(cleanupCheers() || msgsChanged) await saveCoreRaw();
  }
  return connectionError;
}
function normalizeMessages(){
  let changed = false;
  Object.keys(CORE.messages).forEach(sid=>{
    const byDate = CORE.messages[sid] || {};
    Object.keys(byDate).forEach(date=>{
      const val = byDate[date];
      if(!Array.isArray(val)){
        const item = {
          id: uid(),
          photos: val.photos || [],
          content: val.msg || '',
          comments: val.reply ? [{from:'teacher', text:val.reply, ts:date}] : []
        };
        byDate[date] = [item];
        changed = true;
      }
    });
  });
  return changed;
}
const CHEER_TTL_MS = 3*24*60*60*1000; // 3일
function cleanupCheers(target){
  target = target || CORE;
  const now = Date.now();
  let changed = false;
  target.cheers.forEach(c=>{ if(c.t===undefined){ c.t = now; changed = true; } });
  const before = target.cheers.length;
  target.cheers = target.cheers.filter(c => (now - c.t) < CHEER_TTL_MS);
  if(target.cheers.length !== before) changed = true;
  return changed;
}
async function saveCoreRaw(){
  // 페이지를 처음 열 때만 쓰는 무조건 저장(큐/병합을 거치지 않음).
  // 이 시점엔 방금 서버에서 읽어온 상태이므로 별도 병합이 필요 없음.
  try{ await window.storage.set('core', JSON.stringify(CORE), true); }
  catch(e){ console.error('저장 실패', e); }
}
let saveQueue = Promise.resolve();
let pendingMutations = [];
let activeBatch = null; // 현재 진행 중인 저장 배치 ({drained, promise})
function saveCore(mutateFn){
  // 화면 반응성을 위해 이번 변경을 로컬 상태에 즉시 반영 (낙관적 업데이트)
  if(mutateFn){
    mutateFn(CORE);
    pendingMutations.push(mutateFn);
  }
  // 아직 스냅샷을 뜨지 않은(=아직 pendingMutations를 비우지 않은) 배치가 진행 중이면
  // 그 배치에 합류해서 같은 결과를 공유한다. 이미 스냅샷을 뜬 배치라면 내 변경이
  // 거기 포함되지 않으므로, 새 배치를 만들어 이전 배치 뒤에 순서대로 이어 붙인다.
  if(activeBatch && !activeBatch.drained){
    return activeBatch.promise;
  }
  const batch = {drained:false, promise:null};
  batch.promise = saveQueue.then(()=> saveCoreToServer(batch));
  saveQueue = batch.promise.catch(()=>false);
  activeBatch = batch;
  batch.promise.finally(()=>{ if(activeBatch===batch) activeBatch = null; });
  return batch.promise;
}
let lastSyncTime = 0; // 마지막으로 서버와 확실히 동기화된(직접 읽거나 쓴) 시각
async function saveCoreToServer(batch){
  const myMutations = pendingMutations;
  pendingMutations = [];
  if(batch) batch.drained = true; // 이 시점 이후에 들어오는 변경은 이 배치에 포함되지 않음
  if(!myMutations.length) return true; // 이번 차례에 새로 반영할 변경이 없으면 조용히 건너뜀
  try{
    // 저장 직전 서버의 최신 상태를 다시 받아와서 그 위에 그동안 쌓인 변경들을 반영.
    // 다만 방금 우리가 직접 읽거나 쓴 지 얼마 안 됐다면(=우리 CORE가 이미 최신이라고 신뢰할 수 있으면)
    // 다시 조회하지 않는다 - 구글 드라이브는 쓰기 직후 곧바로 읽으면 아주 잠깐 예전 내용을
    // 돌려줄 수 있어서(최종 일관성), 매번 재조회하면 오히려 방금 저장한 내용을 놓치고 예전
    // 상태로 덮어써버리는 사고가 날 수 있기 때문. 이 경우 CORE는 이미 낙관적 적용으로
    // 최신 상태이므로 변경사항을 다시 적용하지 않고 그대로 저장한다(이중 적용 방지).
    const needsFreshFetch = (Date.now() - lastSyncTime) > 3000;
    if(needsFreshFetch){
      let fresh = CORE;
      try{
        const r = await window.storage.get('core', true);
        if(r && r.value) fresh = JSON.parse(r.value);
      }catch(e){ /* 최신 상태 조회 실패 시 현재 메모리 상태 기준으로 진행 */ }
      applyCoreDefaults(fresh);
      myMutations.forEach(fn=> fn(fresh));
      CORE = fresh;
      render(); // 병합된 최신 상태로 화면도 갱신
    }
    await window.storage.set('core', JSON.stringify(CORE), true);
    lastSyncTime = Date.now();
    return true;
  }catch(e){
    console.error('저장 실패', e);
    showSaveFailedBanner();
    return false;
  }
}

function computeStats(sid){
  const g = CORE.goals[sid] || {};
  let achieved=0, notachieved=0;
  let achievedDates=[], notachievedDates=[];
  Object.keys(g).sort().reverse().forEach(date=>{
    const rec = g[date];
    if(rec.achieved==='achieved'){achieved++; achievedDates.push(date);}
    else if(rec.achieved==='notachieved'){notachieved++; notachievedDates.push(date);}
  });
  const total = achieved+notachieved;
  const rate = total>0 ? Math.round((achieved/total)*1000)/10 : 0;
  return {achieved,notachieved,rate,total,achievedDates,notachievedDates};
}
function rateColorClass(rate){
  if(rate>=90) return 'green';
  if(rate>=70) return 'orange';
  return 'red';
}
function getRanking(){
  return CORE.students.map(s=>({...s, stats:computeStats(s.id), cardCount:(CORE.cards[s.id]||[]).length, qCount:getStudentBoardPosts(s.id).length}))
    .filter(s=>s.stats.total>0)
    .sort((a,b)=> b.stats.rate-a.stats.rate || a.cardCount-b.cardCount || b.qCount-a.qCount);
}
function groupName(gid){
  const g = CORE.groups.find(x=>x.id===gid);
  return g ? g.name : '미배정';
}
function studentName(sid){
  const s = CORE.students.find(x=>x.id===sid);

let lastToggleClick = {};
async function setAchieve(sid,date,val){
  const key = sid+'|'+date+'|'+val;
  const now = Date.now();
  if(lastToggleClick[key] && now - lastToggleClick[key] < 500) return; // 실수로 인한 연속 클릭 방지
  lastToggleClick[key] = now;
  saveCore(core=>{
    if(!core.goals[sid]) core.goals[sid] = {};
    if(!core.goals[sid][date]) core.goals[sid][date] = {achieved:null};
    core.goals[sid][date].achieved = (core.goals[sid][date].achieved===val) ? null : val;
  });
  render();
}

function rankingHtml(clickable, modalType){
  modalType = modalType || 'studentDetail';
  const ranked = getRanking();
  if(ranked.length===0) return '<h2>순위</h2><p class="empty">아직 기록이 없습니다.</p>';
  /* 공동 순위 계산: 달성률과 초과학습 횟수가 모두 같으면 같은 순위 */
  let lastRank = 0;
  const withRank = ranked.map((s,i)=>{
    if(i===0){ lastRank = 1; }
    else{
      const prev = ranked[i-1];
      const same = s.stats.rate===prev.stats.rate && s.cardCount===prev.cardCount && s.qCount===prev.qCount;
      if(!same) lastRank = i+1;
    }
    return {...s, rank:lastRank};
  });
  const top5 = withRank.filter(s=>s.rank<=5);
  const medals = ['🥇','🥈','🥉'];
  let rows = top5.map(s=>{
    const i = s.rank-1;
    const topClass = i===0?'top1':i===1?'top2':i===2?'top3':'';
    const medal = i<3 ? medals[i] : '';
    const clickAttr = clickable ? ' onclick="openModal(\''+modalType+'\',{studentId:\''+s.id+'\'})"' : '';
    return '<div class="rank-row '+topClass+'">'+
      '<div class="rank-medal">'+medal+'</div><div class="rank-num">'+s.rank+'</div>'+
      '<div class="rank-name"'+clickAttr+'>'+escapeHtml(s.name)+' <span class="rank-group">('+escapeHtml(groupName(s.groupId))+')</span></div>'+
      '<span class="pill '+rateColorClass(s.stats.rate)+'">'+s.stats.rate+'%</span>'+
    '</div>';
  }).join('');
  return '<h2>달성률 순위</h2><p class="sub">기록이 있는 학생만 표시됩니다. 동점자는 옐로카드 수가 적은 순, 그다음 질문 개수가 많은 순으로 순위를 나누고, 그래도 같으면 공동 순위로 표시돼요. (5위까지 표시)</p>'+rows;
}

function formatBackupLabel(name){
  const m = name.match(/_(\d{8})_(\d{6})\.json$/);
  if(!m) return name;
  const d = m[1], t = m[2];
  return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8)+' '+t.slice(0,2)+':'+t.slice(2,4)+':'+t.slice(4,6);
}

  confirmAction('이 시점으로 복원할까요? 지금 상태는 복원 전 자동으로 백업됩니다.', async ()=>{
    try{
      const r = await callBackend({action:'restore', key:'core', backupName});
      if(r && r.error){ toast('복원 실패: '+r.error); return; }
      toast('복원되었습니다. 화면을 새로고침합니다...');
      setTimeout(()=>location.reload(), 1000);
    }catch(e){
      toast('복원 중 오류가 발생했습니다.');
    }
  }, '복원');
}
function downloadBackup(){
  try{
    const data = JSON.stringify(CORE, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'goal-tracker-backup-'+todayStr()+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('백업 파일을 다운로드했습니다.');
  }catch(e){
    console.error('백업 실패', e);
    toast('백업 파일 생성 중 오류가 발생했습니다.');
  }
}

  if(!val){ toast('내용을 입력해주세요.'); return; }
  const ok = await saveCore(core=>{
    const post = (core.qBoard[folderId]||[]).find(p=>p.id===postId);
    if(post) post.content = val;
  });
  if(!ok){ toast('⚠️ 저장에 실패했어요. 다시 시도해주세요.'); render(); return; }
  view.data.editingKind = null; view.data.editingId = null;
  toast('수정되었습니다.');
  render();
}

function renderInboxMsgContent(){

        if(!item.content && !(item.photos||[]).length) return;
        flat.push({sid:s.id, sname:s.name, date, item});

    });
  });
  flat.sort((a,b)=> b.date.localeCompare(a.date));
  let msgRows = flat.map(function(row){
    const sid=row.sid, sname=row.sname, date=row.date, item=row.item;
    const elId = 'inboxReply_'+sid+'_'+item.id;

      '<button class="btn danger sm" onclick="deleteMessagePost(\''+sid+'\',\''+date+'\',\''+item.id+'\')">삭제</button></div>'+
      renderPhotosBlock(item.photos||[], true)+

      renderThread(item.comments, function(cid){ return "deleteMessageComment('"+sid+"','"+date+"','"+item.id+"','"+cid+"')"; })+
      '<div class="comment-input-row"><input type="text" id="'+elId+'" placeholder="답변을 입력하세요" onkeydown="if(event.key===\'Enter\') addMessageComment(\''+sid+'\',\''+date+'\',\''+item.id+'\',\'teacher\',\''+elId+'\',\''+photoKey+'\')">'+

  '</div>';

/* ============ 정답 통계 (그룹별 활성화) ============ */
function adminStats(){
  const enabledGroups = CORE.groups.filter(g=>g.resultEnabled);
  if(!enabledGroups.length){
    return '<div class="card"><h2>정답 통계</h2><p class="empty">결과탭이 활성화된 그룹이 없습니다. 그룹 관리에서 먼저 켜주세요.</p></div>';
  }
  const tasks = CORE.resultTasks||[];
  const taskMgmt = '<div class="card"><h3>📌 과제 관리</h3><p class="sub">과제를 등록하면 학생들이 그 과제를 선택해서 결과를 입력할 수 있어요.</p>'+
    '<div class="comment-input-row"><input type="text" id="newTaskName" placeholder="예: 2단원 연습문제" onkeydown="if(event.key===\'Enter\') addResultTask()"><button class="btn teal" onclick="addResultTask()">추가</button></div>'+
    '<button class="btn outline sm" style="margin-top:8px;" onclick="migrateOldResultDates()">🔄 예전 날짜별 기록을 과제로 옮기기</button>'+
    (tasks.length? tasks.map(t=>'<div class="qa-entry flex-between"><span>📌 '+escapeHtml(t.name)+'</span><button class="btn danger sm" onclick="deleteResultTask(\''+t.id+'\')">삭제</button></div>').join('') : '<p class="empty" style="margin-top:10px;">등록된 과제가 없습니다.</p>')+
  '</div>';
  if(!tasks.length){
    return taskMgmt;
  }
  const taskId = tasks.find(t=>t.id===view.data.statsTaskId) ? view.data.statsTaskId : tasks[tasks.length-1].id;
  const gid = enabledGroups.find(g=>g.id===view.data.statsGroupId) ? view.data.statsGroupId : enabledGroups[0].id;
  const students = sortByName(CORE.students.filter(s=>s.groupId===gid));
  const data = students.map(s=>{
    const raw = (CORE.problems[s.id] && CORE.problems[s.id][taskId]) || '';
    const nums = parseProblemNumbers(raw);
    return {id:s.id, name:s.name, count:nums.length, nums};
  });
  const submittedCount = data.filter(d=>d.nums.length).length;

  /* 문제 번호별로 맞힌 학생 수 집계 - 입력된 가장 큰 번호까지 0으로 채워서 표시 */
  const tally = {};
  data.forEach(d=>{ d.nums.forEach(n=>{ tally[n] = (tally[n]||0)+1; }); });
  let maxNum = 0;
  data.forEach(d=>{ d.nums.forEach(n=>{ const v = parseInt(n,10); if(!isNaN(v) && String(v)===n.trim() && v>maxNum) maxNum = v; }); });
  const numberKeys = [];
  for(let i=1;i<=maxNum;i++) numberKeys.push(String(i));
  Object.keys(tally).forEach(k=>{ if(numberKeys.indexOf(k)===-1) numberKeys.push(k); });
  numberKeys.sort((a,b)=>{
    const na = parseFloat(a), nb = parseFloat(b);
    if(!isNaN(na) && !isNaN(nb) && na!==nb) return na-nb;
    if(!isNaN(na) && isNaN(nb)) return -1;
    if(isNaN(na) && !isNaN(nb)) return 1;
    return a.localeCompare(b, 'ko');
  });
  const maxTally = Math.max(1, ...numberKeys.map(k=>tally[k]||0));
  const numberBars = numberKeys.map(k=>{
    const cnt = tally[k]||0;
    const pct = Math.round((cnt/maxTally)*100);
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:44px;">'+
      '<div style="font-size:13px;font-weight:700;color:var(--accent-dark);">'+cnt+'</div>'+
      '<div style="width:100%;max-width:32px;height:140px;display:flex;align-items:flex-end;">'+
        '<div style="width:100%;height:'+pct+'%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px;"></div>'+
      '</div>'+
      '<div style="font-size:11.5px;color:var(--ink-soft);text-align:center;line-height:1.3;">'+escapeHtml(k)+'번</div>'+
    '</div>';
  }).join('');

  const groupOptions = enabledGroups.map(g=>'<option value="'+g.id+'"'+(g.id===gid?' selected':'')+'>'+escapeHtml(g.name)+'</option>').join('');
  const taskOptions = tasks.map(t=>'<option value="'+t.id+'"'+(t.id===taskId?' selected':'')+'>'+escapeHtml(t.name)+'</option>').join('');
  const rows = data.map(d=>'<tr><td class="name-cell" onclick=\'showAnswerGrid("'+d.name.replace(/"/g,'')+'", '+JSON.stringify(d.nums)+', '+maxNum+')\'>'+escapeHtml(d.name)+'</td><td>'+d.count+'개</td><td style="text-align:left;">'+(d.nums.length? escapeHtml(d.nums.join(', ')) : '<span class="small-muted">미입력</span>')+'</td></tr>').join('');
  return taskMgmt+'<div class="card">'+
    '<h2>정답 통계</h2><p class="sub">그룹과 과제를 선택하면 문제 번호별로 몇 명이 맞혔는지 확인할 수 있어요. 이름을 클릭하면 그 학생의 문항별 정오답을 볼 수 있어요.</p>'+
    '<div class="flex-between" style="margin-bottom:16px;gap:10px;">'+
      '<div class="field" style="margin:0;flex:1;min-width:140px;"><label>그룹</label><select onchange="view.data.statsGroupId=this.value; render();">'+groupOptions+'</select></div>'+
      '<div class="field" style="margin:0;flex:1;min-width:140px;"><label>과제</label><select onchange="view.data.statsTaskId=this.value; render();">'+taskOptions+'</select></div>'+
    '</div>'+
    (students.length ?
      '<p class="small-muted" style="margin-bottom:10px;">전체 '+students.length+'명 중 '+submittedCount+'명 입력함 · 막대 위 숫자는 그 번호를 맞힌 학생 수</p>'+
      (numberKeys.length ?
        '<div style="display:flex;gap:10px;align-items:flex-end;padding:10px 4px 4px;overflow-x:auto;">'+numberBars+'</div>'
        : '<p class="empty">아직 입력된 문제 번호가 없습니다.</p>')+
      '<table style="margin-top:18px;"><tr><th style="text-align:left;">이름</th><th>맞은 문제 수</th><th style="text-align:left;">맞은 문제 번호</th></tr>'+rows+'</table>'
      : '<p class="empty">이 그룹에 등록된 학생이 없습니다.</p>')+
  '</div>';
}
async function addResultTask(){
  const el = document.getElementById('newTaskName');
  const name = el.value.trim();
  if(!name) return;
  const newTask = {id:uid(), name, createdAt:todayStr()};
  saveCore(core=>{
    if(!core.resultTasks) core.resultTasks = [];
    core.resultTasks.push(newTask);
  });
  el.value = '';
  toast('과제가 추가되었습니다.');
  render();
}
function migrateOldResultDates(){
  const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
  const hasOldData = Object.keys(CORE.problems||{}).some(sid=>
    Object.keys(CORE.problems[sid]||{}).some(k=>dateRegex.test(k) && CORE.problems[sid][k])
  );
  if(!hasOldData){ toast('옮길 예전 날짜별 기록이 없습니다.'); return; }
  confirmAction('예전 날짜별 기록을 과제로 옮길까요? 날짜마다 과제가 하나씩 만들어지고, 학생들이 입력했던 내용이 그대로 옮겨집니다.', ()=>{
    let taskCount = 0, movedCount = 0;
    saveCore(core=>{
      if(!core.resultTasks) core.resultTasks = [];
      const datesWithData = new Set();
      Object.keys(core.problems||{}).forEach(sid=>{
        Object.keys(core.problems[sid]||{}).forEach(k=>{
          if(dateRegex.test(k) && core.problems[sid][k]) datesWithData.add(k);
        });
      });
      const dateToTaskId = {};
      Array.from(datesWithData).sort().forEach(d=>{
        const taskName = d+' 결과';
        let task = core.resultTasks.find(t=>t.name===taskName);
        if(!task){
          task = {id:uid(), name:taskName, createdAt:d};
          core.resultTasks.push(task);
          taskCount++;
        }
        dateToTaskId[d] = task.id;
      });
      Object.keys(core.problems||{}).forEach(sid=>{
        const rec = core.problems[sid];
        Object.keys(rec).slice().forEach(k=>{
          if(dateRegex.test(k)){
            const taskId = dateToTaskId[k];
            if(taskId && rec[k]){ rec[taskId] = rec[k]; movedCount++; }
            delete rec[k];
          }
        });
      });
    });
    toast('과제 '+taskCount+'개를 만들고 기록 '+movedCount+'건을 옮겼습니다.');
    render();
  }, '옮기기');
}
function deleteResultTask(id){
  confirmAction('이 과제를 삭제할까요? 학생들이 입력한 결과도 함께 삭제됩니다.', ()=>{
    saveCore(core=>{
      core.resultTasks = (core.resultTasks||[]).filter(t=>t.id!==id);
      Object.keys(core.problems||{}).forEach(sid=>{ if(core.problems[sid]) delete core.problems[sid][id]; });
    });
    if(view.data.statsTaskId===id) view.data.statsTaskId=null;
    render();
  });
}

function getStudentBoardPosts(sid){
  const out = [];
  CORE.qFolders.forEach(f=>{
    getFolderPosts(f.id).forEach(p=>{
      if(p.studentId===sid) out.push(Object.assign({}, p, {folderName:f.name}));
    });
  });
  return out.sort((a,b)=> (b.ts||'').localeCompare(a.ts||''));
}
/* ============ 학생 상세 (관리자용) ============ */
function renderStampCalendar(sid, year, month, navFn){
  const g = CORE.goals[sid] || {};
  const cardSet = new Set(CORE.cards[sid]||[]);
  const first = new Date(year, month-1, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  let cells = '';
  for(let i=0;i<startDow;i++) cells += '<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = year+'-'+String(month).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const rec = g[dateStr];
    const achieved = rec && rec.achieved==='achieved';
    const hasCard = cardSet.has(dateStr);
    cells += '<div class="cal-cell">'+
      '<div class="cal-day">'+d+'</div>'+
      (achieved ? (CORE.stampImage? '<img src="'+CORE.stampImage+'" class="cal-stamp">' : '<div style="font-size:18px;">🎉</div>') : '')+
      (hasCard? '<div class="cal-card">🟧</div>' : '')+
    '</div>';
  }
  return '<div class="cal-head"><button class="btn sm outline" onclick="'+navFn+'(-1)">‹</button>'+
      '<div class="cal-title">'+year+'년 '+month+'월</div>'+
      '<button class="btn sm outline" onclick="'+navFn+'(1)">›</button>'+
    '</div>'+
    '<div class="cal-grid">'+
      ['일','월','화','수','목','금','토'].map(d=>'<div class="cal-dow">'+d+'</div>').join('')+
      cells+
    '</div>';
}
function changeModalCalMonth(delta){
  const now = new Date();
  let y = modal.data.calYear || now.getFullYear();
  let m = (modal.data.calMonth || (now.getMonth()+1)) + delta;
  if(m<1){ m=12; y--; } else if(m>12){ m=1; y++; }
  modal.data.calYear = y; modal.data.calMonth = m;
  render();
}

async function addYellowCard(sid){
  const d = todayStr();
  if(CORE.cards[sid] && CORE.cards[sid].includes(d)){ toast('오늘은 이미 옐로카드를 부여했다.'); return; }
  let alreadyGiven = false;
  saveCore(core=>{
    if(!core.cards[sid]) core.cards[sid]=[];
    if(core.cards[sid].includes(d)){ alreadyGiven = true; return; }
    core.cards[sid].push(d);
  });
  if(alreadyGiven){ toast('오늘은 이미 옐로카드를 부여했다.'); return; }
  render();
}

function renderModal(){
  let inner = '';
  if(modal.type==='dateList'){
    const dates = modal.data.dates||[];
    inner = '<div class="modal-head"><h2>'+escapeHtml(modal.data.title)+'</h2><button class="close-x" onclick="closeModal()">✕</button></div>'+
      (dates.length? '<table><tr><th>날짜</th></tr>'+dates.map(d=>'<tr><td>'+d+'</td></tr>').join('')+'</table>' : '<p class="empty">기록이 없습니다.</p>');
  } else if(modal.type==='confirm'){
    inner = '<div class="modal-head"><h2>확인</h2></div>'+
      '<p style="font-size:14px;line-height:1.6;">'+escapeHtml(modal.data.message)+'</p>'+
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;">'+
        '<button class="btn outline" onclick="closeModal()">취소</button>'+
        '<button class="btn danger" onclick="confirmYes()">'+escapeHtml(modal.data.label)+'</button>'+

function renderStudent(){
  const sid = session.studentId;
  const s = CORE.students.find(x=>x.id===sid);
  if(!s){ logout(); return ''; }
  const myGroup = CORE.groups.find(g=>g.id===s.groupId);
  const resultOn = !!(myGroup && myGroup.resultEnabled);
  const tabs = [['home','홈'],['ranking','순위/현황'],['allstatus','전체 수행 현황'],['mystatus','내 수행 현황'],['message','오늘의 한마디'],['qboard','질문 게시판']];
  if(resultOn) tabs.push(['result','오늘의 목표달성 결과']);
  tabs.push(['cheers','모두에게 응원 한 마디'],['settings','비밀번호 변경']);
  let out = '<div class="wrap">';
  out += '<div class="notice-banner"><div class="label">공지사항</div><p>'+(CORE.notice? escapeHtml(CORE.notice) : '등록된 공지사항이 없습니다.')+'</p></div>';
  out += '<div class="tabs">'+tabs.map(t=>'<button class="tab '+(view.tab===t[0]?'active':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>';
  if(view.tab==='ranking') out += studentRanking();
  else if(view.tab==='allstatus') out += '<div class="card">'+allStatusHtml('studentQA')+'</div>';
  else if(view.tab==='mystatus') out += studentMyStatus(sid);
  else if(view.tab==='message') out += studentMessage(sid);
  else if(view.tab==='qboard') out += renderQBoard();
  else if(view.tab==='result' && resultOn) out += studentResult(sid);
  else if(view.tab==='cheers') out += studentCheers();
  else if(view.tab==='settings') out += studentSettings(sid);
  else out += studentHomeOverview(sid);
  out += '</div>';
  return out;
}
let tempReplyPhotos = {};
function renderReplyPhotoThumbs(key){
  const arr = tempReplyPhotos[key] || [];
  if(!arr.length) return '';
  return '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;">'+
    arr.map((p,i)=>'<div style="position:relative;">'+
      '<img src="'+p+'" style="max-width:80px;border-radius:8px;border:1px solid var(--border);display:block;">'+
      '<button type="button" onclick="removeReplyPhoto(\''+key+'\','+i+')" style="position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;line-height:1;">✕</button>'+
    '</div>').join('')+
  '</div>';
}
function removeReplyPhoto(key,i){
  (tempReplyPhotos[key]||[]).splice(i,1);
  const el = document.getElementById('replyPhotoThumbs_'+key);
  if(el) el.innerHTML = renderReplyPhotoThumbs(key);
}
async function handleReplyPhoto(e, key){
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  if(!tempReplyPhotos[key]) tempReplyPhotos[key] = [];
  for(const file of files){
    try{
      const compressed = await processPhotoFile(file);
      tempReplyPhotos[key].push(compressed);
      const el = document.getElementById('replyPhotoThumbs_'+key);
      if(el) el.innerHTML = renderReplyPhotoThumbs(key);
    }catch(err){
      console.error('사진 처리 실패', err);
      toast((err && err.message) ? err.message : '사진을 처리하지 못했습니다.');
    }
  }
  e.target.value = '';
}
function replyPhotoPicker(key){
  return '<div style="margin-top:6px;">'+
    '<label for="replyPhotoInput_'+key+'" class="btn outline sm" style="display:inline-block;">📷 사진 첨부</label>'+
    '<input type="file" id="replyPhotoInput_'+key+'" accept="image/*,.heic,.heif" multiple onchange="handleReplyPhoto(event,\''+key+'\')" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">'+
    '<div id="replyPhotoThumbs_'+key+'">'+renderReplyPhotoThumbs(key)+'</div>'+
  '</div>';
}
function linkify(escapedText){
  return escapedText.replace(/(https?:\/\/[^\s<]+)/g, function(url){
    return '<a href="'+url+'" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;word-break:break-all;">'+url+'</a>';
  });
}
function renderThread(comments, onDeleteFn){

        (onDeleteFn ? '<button class="btn danger sm" style="padding:1px 8px;font-size:10px;" onclick="'+onDeleteFn(c.id)+'">삭제</button>' : '')+

      (c.photos && c.photos.length ? renderPhotosBlock(c.photos, true) : '')+
      (c.text? '<div class="thread-text">'+linkify(escapeHtml(c.text))+'</div>' : '')+
      (c.ts? '<div class="small-muted" style="margin-top:3px;font-size:10.5px;">'+escapeHtml(c.ts)+'</div>' : '')+

async function addMessageComment(sid, date, itemId, from, elId, photoKey){
  const el = document.getElementById(elId);
  const val = el.value.trim();
  const photos = photoKey ? (tempReplyPhotos[photoKey]||[]).slice() : [];
  if(!val && !photos.length) return;
  const comment = {id:uid(), from, text:val, photos, ts:new Date().toLocaleString('ko-KR')};
  if(from==='student') comment.studentId = sid;
  saveCore(core=>{
    if(!core.messages[sid]) core.messages[sid] = {};
    const arr = core.messages[sid][date];
    const item = arr && arr.find(x=>x.id===itemId);
    if(!item) return;
    if(!item.comments) item.comments = [];
    item.comments.push(comment);
  });
  if(photoKey) delete tempReplyPhotos[photoKey];
  toast(from==='teacher'?'답변이 저장되었습니다.':'댓글이 등록되었습니다.');
  render();
}

function isHeicFile(file){
  const type = (file.type||'').toLowerCase();
  const name = (file.name||'').toLowerCase();
  return type.indexOf('heic')>-1 || type.indexOf('heif')>-1 || name.endsWith('.heic') || name.endsWith('.heif');
}
async function processPhotoFile(file){
  let blob = file;
  if(isHeicFile(file)){
    if(typeof window.heic2any === 'function'){
      let converted = await window.heic2any({blob:file, toType:'image/jpeg', quality:0.8});
      if(Array.isArray(converted)) converted = converted[0];
      blob = converted;
    } else {
      throw new Error('iPhone 사진(HEIC) 변환 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.');
    }
  }
  const dataUrl = await new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('파일을 읽을 수 없습니다.'));
    reader.onload = (ev)=>resolve(ev.target.result);
    reader.readAsDataURL(blob);
  });
  const compressed = await new Promise((resolve, reject)=>{
    const img = new Image();
    img.onerror = ()=>reject(new Error('사진 형식을 지원하지 않습니다.'));
    img.onload = function(){
      const maxW = 1600;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale) || img.width;
      canvas.height = Math.round(img.height*scale) || img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = dataUrl;
  });
  // 별도 파일로 업로드해서 core.json이 계속 가벼운 상태를 유지하도록 함.
  // 업로드 실패 시(네트워크 문제 등) 기존 방식(base64 그대로 저장)으로 대체됨.
  try{
    const up = await callBackend({action:'uploadPhoto', dataUrl: compressed, filename:(file.name||'photo')});
    if(up && up.url) return up.url;
  }catch(e){
    console.error('사진 업로드 실패, 임시로 내장 저장합니다.', e);
  }
  return compressed;
}
async function handleQuestionPhoto(e){
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  for(const file of files){
    try{
      const compressed = await processPhotoFile(file);
      tempPhotos.push(compressed);
      const el = document.getElementById('photoThumbs');
      if(el) el.innerHTML = renderPhotoThumbs();
    }catch(err){
      console.error('사진 처리 실패', err);
      toast((err && err.message) ? err.message : '사진을 처리하지 못했습니다.');
    }
  }
  e.target.value = ''; /* allow re-selecting the same file if needed */
}

/* ============ 오늘의 목표달성 결과 (그룹별 활성화) ============ */
function parseProblemNumbers(str){
  if(!str) return [];
  const seen = new Set();
  const result = [];
  str.split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>{
    if(!seen.has(s)){ seen.add(s); result.push(s); }
  });
  return result;
}

  });

  render();
}

const CHEER_ROW_H = 88; /* item height(80) + margin-bottom(8) */
function cheerRowHtml(c){
  return '<div class="cheer-item"><div><p>💬 '+escapeHtml(c.text)+'</p><div class="ts">'+escapeHtml(c.ts)+'</div></div></div>';
}
function renderCheerList(){
  cleanupCheers();
  const list = CORE.cheers.slice().reverse();
  if(!list.length) return '<p class="empty">아직 등록된 응원이 없습니다.</p>';
  let visible = list;
  if(list.length > 5){
    const n = list.length;
    visible = [];
    for(let i=0;i<5;i++){ visible.push(list[(cheerRotateIndex+i)%n]); }
    return '<div class="cheer-viewport"><div class="cheer-track" id="cheerTrack">'+visible.map(cheerRowHtml).join('')+'</div></div>';
  }
  return visible.map(cheerRowHtml).join('');
}
async function refreshCheerDisplay(){
  const box = document.getElementById('cheerListBox');
  if(!box) return;
  // 만료된 응원 숨김 처리는 화면 표시용으로만 로컬에서 처리하고,
  // 서버 저장은 하지 않음 (다른 저장 작업과 겹쳐 충돌할 수 있어서).
  // 실제 정리·저장은 페이지를 새로 열 때(loadCore) 한 번만 수행됨.
  cleanupCheers();
  const list = CORE.cheers.slice().reverse();
  if(list.length <= 5){
    box.innerHTML = renderCheerList();
    return;
  }
  const track = document.getElementById('cheerTrack');
  if(!track){ box.innerHTML = renderCheerList(); return; }
  const n = list.length;
  const rows = [];
  for(let i=0;i<6;i++){ rows.push(list[(cheerRotateIndex+i)%n]); }
  track.innerHTML = rows.map(cheerRowHtml).join('');
  track.style.transition = 'none';
  track.style.transform = 'translateY(0)';
  void track.offsetHeight; /* force reflow so the transition below actually animates */
  track.style.transition = 'transform .6s ease';
  track.style.transform = 'translateY(-'+CHEER_ROW_H+'px)';
  setTimeout(()=>{
    cheerRotateIndex++;
    if(!document.getElementById('cheerTrack')) return; /* view changed while animating */
    const newRows = [];
    for(let i=0;i<5;i++){ newRows.push(list[(cheerRotateIndex+i)%n]); }
    track.style.transition = 'none';
    track.innerHTML = newRows.map(cheerRowHtml).join('');
    track.style.transform = 'translateY(0)';
  }, 620);
}

/* ============ 시작 ============ */
async function init(){

      '<p class="sub">데이터가 지워진 게 아니라, 지금 이 화면이 저장소(Google Apps Script)에 연결하지 못하고 있는 상태예요. 아래를 확인해보세요.</p>'+
      '<ul style="font-size:13px;color:var(--ink-soft);line-height:1.9;padding-left:18px;margin:0 0 14px;">'+

        '<li>Apps Script 배포 설정에서 "액세스 권한: 모든 사용자(Anyone)"으로 되어 있는지 확인</li>'+
        '<li>Apps Script 코드를 수정했다면 배포 관리에서 "새 버전으로 배포"를 다시 했는지 확인</li>'+
        '<li>인터넷 연결 상태 확인</li>'+
      '</ul>'+
      '<p class="small-muted">오류 내용: '+escapeHtml(String((err && err.message) || err))+'</p>'+
      '<button class="btn teal" onclick="location.reload()">다시 시도</button>'+
      '</div></div>';
    return;
  }
  render();
  setInterval(()=>{ refreshCheerDisplay(); }, 4000);
  setInterval(()=>{ silentRefresh(); }, 20000); // 20초마다 다른 곳에서 생긴 변경을 조용히 반영
}
async function silentRefresh(){
  if(!session.role) return; // 로그인 전이면 건드리지 않음
  if(modal || pendingMutations.length) return; // 저장 대기중이거나 모달 작성 중이면 건너뜀
  const active = document.activeElement;
  if(active && (active.tagName==='TEXTAREA' || active.tagName==='INPUT')) return; // 입력 중인 내용 보호
  try{
    const r = await window.storage.get('core', true);
    if(r && r.value){
      const serverCore = JSON.parse(r.value);
      applyCoreDefaults(serverCore);
      lastSyncTime = Date.now();
      if(JSON.stringify(serverCore) !== JSON.stringify(CORE)){
        CORE = serverCore;
        render();
      }
    }
  }catch(e){ /* 실패해도 조용히 다음 주기에 재시도 */ }
}
async function manualRefresh(){
  if(pendingMutations.length){ toast('저장이 진행 중이에요. 잠시 후 다시 눌러주세요.'); return; }
  const active = document.activeElement;
  if(active && (active.tagName==='TEXTAREA' || active.tagName==='INPUT') && active.value){
    if(!confirm('입력 중인 내용이 있어요. 새로고침하면 저장하지 않은 내용은 사라져요. 계속할까요?')) return;
  }
  try{
    const r = await window.storage.get('core', true);
    if(r && r.value){
      const serverCore = JSON.parse(r.value);
      applyCoreDefaults(serverCore);
      CORE = serverCore;
      lastSyncTime = Date.now();
      render();
      toast('최신 내용을 불러왔어요.');
    }
  }catch(e){
    toast('새로고침에 실패했어요. 잠시 후 다시 시도해주세요.');
  }
}
